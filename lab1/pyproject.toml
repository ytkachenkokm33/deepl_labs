[project]
name = "lab1-backprop"
version = "1.0.0"
description = "Ручний backpropagation та незалежні перевірки на Iris"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.5",
    "scikit-learn==1.6.1",
    "torch==2.7.0+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
